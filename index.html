<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control Horario</title>
  <meta name="description" content="Registro personal de horas de trabajo, minutos extra y recuperaciones.">
  <meta name="theme-color" content="#15803d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Control Horario">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- Menú lateral (ordenador) -->
    <aside class="sidebar" aria-label="Secciones">
      <div class="brand">
        <img src="icon-192.png" alt="" width="36" height="36">
        <span>Control Horario</span>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Inicio</h1>
        <button class="btn btn-ghost btn-sm hidden" id="installBtn" type="button">Instalar app</button>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>

  <!-- Barra inferior (móvil) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Secciones"></nav>

  <!-- Ventana emergente reutilizable -->
  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-inner" id="modalForm" novalidate>
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" value="cancel" type="submit" aria-label="Cerrar">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFoot" class="modal-foot"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:20px">Esta aplicación necesita JavaScript activado.</p></noscript>

  <script src="calc.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
